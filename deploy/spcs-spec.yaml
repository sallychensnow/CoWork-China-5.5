spec:
  containers:
    - name: cowork
      image: /COWORK/APP/IMAGES/cowork-china:v10
      env:
        SNOWFLAKE_WAREHOUSE: COWORK_WH
        SNOWFLAKE_DATABASE: COWORK
        SNOWFLAKE_SCHEMA: DATA
        USE_ARCTICSWARM: "true"
        LLM_MODEL: "qwen-plus"
        LLM_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      secrets:
        - snowflakeName: COWORK.APP.COWORK_DASHSCOPE_KEY
          envVarName: DASHSCOPE_API_KEY
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
  endpoints:
    - name: app
      port: 3000
      public: true
  networkPolicyConfig:
    allowInternetEgress: true
